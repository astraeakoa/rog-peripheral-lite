name: Build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Test and package
        shell: pwsh
        run: ./build.ps1
      - name: Archive corresponding source
        shell: pwsh
        run: git archive --format=zip --output=ROGPeripheral-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: ROGPeripheral-${{ github.sha }}
          path: |
            ROGPeripheral-win-x64.zip
            ROGPeripheral-source.zip
